<div style="margin:0; padding:0; background:#f4f7fb; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%; background:#f4f7fb; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%; max-width:600px; margin:0 0 20px;">
          <tr>
            <td style="text-align:left;">
              <img
                src="https://advancedanalytica.co.uk/images/infrastructure/logo-black-flipped.svg"
                alt="Advanced Analytica"
                width="180"
                style="display:block; width:180px; max-width:100%; height:auto; border:0;"
              />
            </td>
          </tr>
        </table>

        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%; max-width:600px; background:#0b0e14; border-radius:18px; overflow:hidden;">
          <tr>
            <td style="padding:40px 40px 24px; text-align:left;">
              <div style="margin:0 0 20px; font-size:12px; line-height:1.4; letter-spacing:0.12em; text-transform:uppercase; color:#14b8a6; font-weight:700;">
                Advanced Analytica
              </div>

              <h1 style="margin:0 0 16px; font-size:36px; line-height:1.1; color:#ffffff; font-weight:800;">
                Verify it&rsquo;s you
              </h1>

              <p style="margin:0 0 20px; font-size:18px; line-height:1.6; color:#b8c4d6;">
                Use this verification code to complete a sensitive action on your account. It expires shortly.
              </p>

              <div style="display:inline-block; margin:0 0 28px; padding:16px 22px; border-radius:14px; background:#111927; border:1px solid rgba(255,255,255,0.08); font-size:28px; font-weight:800; letter-spacing:0.24em; color:#ffffff;">
                {{ .Token }}
              </div>

              <p style="margin:0; font-size:13px; line-height:1.6; color:#6f8096;">
                If you did not request this verification, secure your account and contact support.
              </p>
            </td>
          </tr>
        </table>

        <p style="max-width:600px; margin:16px auto 0; font-size:12px; line-height:1.6; color:#7d8ca1; text-align:center;">
          Trusted by some of the world&rsquo;s leading brands
        </p>
      </td>
    </tr>
  </table>
</div>
